version: '3.8'

services:
  app:
    build:
      context: ./chirper
      dockerfile: Dockerfile
    image: laravel-chirper
    container_name: chirper-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./chirper:/var/www
    networks:
      - chirper

  webserver:
    image: nginx:alpine
    container_name: chirper-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./chirper:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - chirper
    depends_on:
      - app

  db:
    image: postgres:15
    container_name: chirper-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - chirper

networks:
  chirper:
    driver: bridge

volumes:
  dbdata:
    driver: local
